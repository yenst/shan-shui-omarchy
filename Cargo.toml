[package]
name = "shan-shui"
version = "0.1.0"
edition = "2024"
description = "Endless shan-shui landscape screensaver for Omarchy (Rust port of LingDong-/shan-shui-inf)"
repository = "https://github.com/yenst/shan-shui-omarchy"
license = "MIT"

[dependencies]
rayon = "1"
softbuffer = "0.4"
tiny-skia = "0.11"
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "rwh_06"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
